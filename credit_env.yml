name: credit_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gdal>=3.9
  - rasterio>=1.4
  - fiona>=1.10
  - pyproj>=3.7
  - shapely>=2.1
  - geopandas=1.1
  - numpy>=2,<2.6
  - pandas
  - scipy
  - matplotlib
  - mapclassify
  - pysal
  - affine
  - xarray
  - rioxarray
  - requests
  - jupyterlab
  - setuptools<81  # earthpy 0.9.4 still imports pkg_resources
  - pip
  - pip:
      - earthpy==0.9.4
      - rasterstats==0.20.0
